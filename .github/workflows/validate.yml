name: Validate vehicle evidence and application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/migrate-s160-evidence.mjs --check
      - run: node scripts/build-vehicle-catalog.mjs --check
      - run: node --test tests/*.test.mjs
      - run: node modeling/s160/validate_web.mjs
      - run: npx tsc --noEmit
      - run: npm run build:pages
      - run: node scripts/validate-pages.mjs
      - run: npx playwright install --with-deps chromium
      - name: Browser workshop regression checks
        run: npx playwright test

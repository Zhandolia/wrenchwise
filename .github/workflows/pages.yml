name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-vehicle-catalog.mjs --check
      - run: node scripts/migrate-s160-evidence.mjs --check
      - run: node --test tests/*.test.mjs
      - run: node modeling/s160/validate_web.mjs
      - run: npx tsc --noEmit
      - run: npm run build:pages
      - run: node scripts/validate-pages.mjs
      - run: npx playwright install --with-deps chromium
      - name: Browser workshop regression checks
        run: npx playwright test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed revision and public asset inventory
        run: node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "$GITHUB_SHA"
